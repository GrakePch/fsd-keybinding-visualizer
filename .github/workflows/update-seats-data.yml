name: Update Camera Seat Data

on:
  workflow_dispatch:
    inputs:
      exporter_run_id:
        description: Optional successful unforge-datacore-exporter workflow run ID
        required: false
        type: string
  schedule:
    - cron: "30 17 * * 4"

permissions:
  contents: write
  actions: read

jobs:
  update-seats-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve exporter run
        id: exporter-run
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RUN_ID: ${{ inputs.exporter_run_id }}
        run: |
          if [ -n "$REQUESTED_RUN_ID" ]; then
            echo "run_id=$REQUESTED_RUN_ID" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          run_id=$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/CxJuice/unforge-datacore-exporter/actions/workflows/export-latest-datacore.yml/runs?branch=main&status=success&per_page=1" \
            | jq -r '.workflow_runs[0].id // empty')

          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download exporter artifact
        uses: actions/download-artifact@v4
        with:
          name: unforge-datacore-json
          path: .cache/unforge
          repository: CxJuice/unforge-datacore-exporter
          run-id: ${{ steps.exporter-run.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate compact camera seat data
        run: node scripts/update-seats-data.mjs .cache/unforge/seats.json src/data/seats.json

      - name: Commit and push changes
        run: |
          if git diff --quiet -- src/data/seats.json; then
            echo "No camera seat data changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/seats.json
          git commit -m "chore(camera): update seat vehicle data"
          git push origin main
