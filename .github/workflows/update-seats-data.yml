name: Update Camera Data

on:
  workflow_dispatch:
    inputs:
      fancy_ref:
        description: Optional Fancy-Star-Data branch, tag, or commit
        required: false
        type: string
  schedule:
    # Every Saturday at 10:30 China Standard Time, after Fancy-Star-Data updates.
    - cron: "30 2 * * 6"

permissions:
  contents: write
  actions: read

jobs:
  update-seats-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Checkout final camera data
        uses: actions/checkout@v4
        with:
          repository: GrakePch/Fancy-Star-Data
          ref: ${{ inputs.fancy_ref || 'main' }}
          path: .cache/fancy-star-data
          token: ${{ secrets.READ_FANCY_STAR_DATA }}

      - name: Sync and validate final camera data
        run: node scripts/sync-camera-data.mjs --source-dir .cache/fancy-star-data

      - name: Commit and push changes
        run: |
          git add src/data/seats.json src/data/third_person_cameras.json src/data/spv_vehicle_main.json

          if git diff --cached --quiet -- src/data/seats.json src/data/third_person_cameras.json src/data/spv_vehicle_main.json; then
            echo "No camera data changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(camera): sync DataCore camera data from Fancy-Star-Data"
          git push origin main
