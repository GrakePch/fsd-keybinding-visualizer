name: Update Camera Seat Data

on:
  workflow_dispatch:
    inputs:
      fancy_ref:
        description: Optional Fancy-Star-Data branch, tag, or commit
        required: false
        type: string
  schedule:
    # Every Saturday at 10:30 China Standard Time, after Fancy-Star-Data updates.
    - cron: "30 2 * * 6"

permissions:
  contents: write
  actions: read

jobs:
  update-seats-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Checkout final seat data
        uses: actions/checkout@v4
        with:
          repository: GrakePch/Fancy-Star-Data
          ref: ${{ inputs.fancy_ref || 'main' }}
          path: .cache/fancy-star-data
          token: ${{ secrets.READ_FANCY_STAR_DATA }}

      - name: Copy and validate final seat data
        run: |
          test -f .cache/fancy-star-data/data/datacore/seats.json
          cp .cache/fancy-star-data/data/datacore/seats.json src/data/seats.json
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";

          const file = "src/data/seats.json";
          const payload = JSON.parse(await readFile(file, "utf8"));
          if (payload.schemaVersion !== 1 || !Array.isArray(payload.seats)) {
            throw new Error(`${file} is not the Fancy-Star-Data seat format`);
          }
          for (const [index, seat] of payload.seats.entries()) {
            if (typeof seat?.groupId !== "string" || !Array.isArray(seat.vehicleIds)) {
              throw new Error(`${file} has an invalid seat entry at index ${index}`);
            }
            if (seat.vehicleIds.some((vehicleId) => typeof vehicleId !== "string")) {
              throw new Error(`${file} has a non-string vehicle ID at index ${index}`);
            }
          }
          console.log(`Validated ${payload.seats.length} camera seat groups from Fancy-Star-Data.`);
          NODE

      - name: Commit and push changes
        run: |
          if git diff --quiet -- src/data/seats.json; then
            echo "No camera seat data changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/seats.json
          git commit -m "chore(camera): sync seat vehicle data from Fancy-Star-Data"
          git push origin main
