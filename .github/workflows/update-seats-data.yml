name: Update Camera Data

on:
  workflow_dispatch:
    inputs:
      fancy_ref:
        description: Optional Fancy-Star-Data branch, tag, or commit
        required: false
        type: string
  schedule:
    # Every Saturday at 10:30 China Standard Time, after Fancy-Star-Data updates.
    - cron: "30 2 * * 6"

permissions:
  contents: write
  actions: read

jobs:
  update-seats-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Checkout final camera data
        uses: actions/checkout@v4
        with:
          repository: GrakePch/Fancy-Star-Data
          ref: ${{ inputs.fancy_ref || 'main' }}
          path: .cache/fancy-star-data
          token: ${{ secrets.READ_FANCY_STAR_DATA }}

      - name: Copy and validate final camera data
        run: |
          test -f .cache/fancy-star-data/data/datacore/seats.json
          test -f .cache/fancy-star-data/data/datacore/third_person_cameras.json
          cp .cache/fancy-star-data/data/datacore/seats.json src/data/seats.json
          cp .cache/fancy-star-data/data/datacore/third_person_cameras.json src/data/third_person_cameras.json
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";

          const seatsFile = "src/data/seats.json";
          const camerasFile = "src/data/third_person_cameras.json";
          const seatsPayload = JSON.parse(await readFile(seatsFile, "utf8"));
          const camerasPayload = JSON.parse(await readFile(camerasFile, "utf8"));
          if (seatsPayload.schemaVersion !== 2 || !Array.isArray(seatsPayload.seats)) {
            throw new Error(`${seatsFile} is not the Fancy-Star-Data seat format`);
          }
          if (camerasPayload.schemaVersion !== 2 || !Array.isArray(camerasPayload.cameras)) {
            throw new Error(`${camerasFile} is not the Fancy-Star-Data third-person camera format`);
          }

          const finiteNumber = (value) => typeof value === "number" && Number.isFinite(value);
          const validVector = (value) => value && ["x", "y", "z"].every((axis) => finiteNumber(value[axis]));
          const cameraIds = new Set();
          for (const [index, camera] of camerasPayload.cameras.entries()) {
            const distance = camera?.baseConfig?.distanceConfig;
            const targetOffset = camera?.baseConfig?.targetOffsetConfig;
            if (typeof camera?.cameraId !== "string" || !camera.cameraId) {
              throw new Error(`${camerasFile} has an invalid camera ID at index ${index}`);
            }
            if (![distance?.initialDistance, distance?.minDistance, distance?.maxDistance].every(finiteNumber)) {
              throw new Error(`${camerasFile} has an invalid distance config at index ${index}`);
            }
            if (![targetOffset?.targetPositionOffset, targetOffset?.userTargetOffsetMin, targetOffset?.userTargetOffsetMax].every(validVector)) {
              throw new Error(`${camerasFile} has an invalid target offset config at index ${index}`);
            }
            if (cameraIds.has(camera.cameraId)) throw new Error(`${camerasFile} contains duplicate camera ID ${camera.cameraId}`);
            cameraIds.add(camera.cameraId);
          }

          for (const [index, seat] of seatsPayload.seats.entries()) {
            if (typeof seat?.groupId !== "string" || !Array.isArray(seat.vehicleIds) || !Array.isArray(seat.thirdPersonCameraIds)) {
              throw new Error(`${seatsFile} has an invalid seat entry at index ${index}`);
            }
            if ([...seat.vehicleIds, ...seat.thirdPersonCameraIds].some((id) => typeof id !== "string")) {
              throw new Error(`${seatsFile} has a non-string ID at index ${index}`);
            }
            const missingCameraId = seat.thirdPersonCameraIds.find((cameraId) => !cameraIds.has(cameraId));
            if (missingCameraId) {
              throw new Error(`${seatsFile} references missing third-person camera ${missingCameraId}`);
            }
          }
          console.log(`Validated ${seatsPayload.seats.length} seats and ${cameraIds.size} third-person cameras from Fancy-Star-Data.`);
          NODE

      - name: Commit and push changes
        run: |
          git add src/data/seats.json src/data/third_person_cameras.json

          if git diff --cached --quiet -- src/data/seats.json src/data/third_person_cameras.json; then
            echo "No camera data changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(camera): sync DataCore camera data from Fancy-Star-Data"
          git push origin main
